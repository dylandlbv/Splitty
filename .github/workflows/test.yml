name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gofmt
        working-directory: backend
        run: test -z "$(gofmt -l .)"

      - name: go vet
        working-directory: backend
        run: go vet ./...

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: unit + API integration tests (race detector, coverage)
        working-directory: backend
        run: go test ./internal/... -race -count=1 -coverprofile=coverage.out

      - name: coverage total
        working-directory: backend
        run: go tool cover -func=coverage.out | tail -1

      - name: e2e smoke (real binary, temp SQLite, full HTTP journey)
        working-directory: backend
        run: go test ./e2e/... -v -count=1 -timeout 180s

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: splitty
          POSTGRES_PASSWORD: splitty
          POSTGRES_DB: splitty
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://splitty:splitty@localhost:5432/splitty?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: store suite on PostgreSQL
        working-directory: backend
        run: go test ./internal/store/... -run 'TestPostgresSuite' -v -count=1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install
        working-directory: frontend
        run: npm ci

      - name: typecheck + build
        working-directory: frontend
        run: npm run build
