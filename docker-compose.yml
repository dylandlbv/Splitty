services:
  app:
    build: .
    environment:
      DB_DRIVER: sqlite
      SQLITE_PATH: /data/splitty.db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set, e.g. export JWT_SECRET=dev-secret}
    ports:
      - '${SPLITTY_PORT:-8080}:80'
    volumes:
      - sqldata:/data

volumes:
  sqldata:
